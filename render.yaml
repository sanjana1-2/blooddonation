services:
  - type: web
    name: blooddonation-api
    runtime: node
    rootDir: serverside
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5001
      - key: MONGODB_URI
        sync: false   # set manually in Render dashboard
      - key: JWT_SECRET
        sync: false   # set manually in Render dashboard
      - key: CLIENT_URL
        sync: false   # set to your Vercel URL after frontend deploy
