<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>RaktSeva - Blood Donation Platform</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            colors: {
              background: 'hsl(var(--background))',
              foreground: 'hsl(var(--foreground))',
              card: 'hsl(var(--card))',
              'card-foreground': 'hsl(var(--card-foreground))',
              popover: 'hsl(var(--popover))',
              'popover-foreground': 'hsl(var(--popover-foreground))',
              primary: 'hsl(var(--primary))',
              'primary-foreground': 'hsl(var(--primary-foreground))',
              secondary: 'hsl(var(--secondary))',
              'secondary-foreground': 'hsl(var(--secondary-foreground))',
              muted: 'hsl(var(--muted))',
              'muted-foreground': 'hsl(var(--muted-foreground))',
              accent: 'hsl(var(--accent))',
              'accent-foreground': 'hsl(var(--accent-foreground))',
              destructive: 'hsl(var(--destructive))',
              'destructive-foreground': 'hsl(var(--destructive-foreground))',
              border: 'hsl(var(--border))',
              input: 'hsl(var(--input))',
              ring: 'hsl(var(--ring))',
            }
          }
        }
      }
    </script>
    <style type="text/tailwindcss">
      @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap');

      :root {
        --background: 0 0% 100%;
        --foreground: 222.2 84% 4.9%;
        --card: 0 0% 100%;
        --card-foreground: 222.2 84% 4.9%;
        --popover: 0 0% 100%;
        --popover-foreground: 222.2 84% 4.9%;
        --primary: 346.8 77.2% 49.8%;
        --primary-foreground: 355.7 100% 97.3%;
        --secondary: 210 40% 96.1%;
        --secondary-foreground: 222.2 47.4% 11.2%;
        --muted: 210 40% 96.1%;
        --muted-foreground: 215.4 16.3% 46.9%;
        --accent: 210 40% 96.1%;
        --accent-foreground: 222.2 47.4% 11.2%;
        --destructive: 0 84.2% 60.2%;
        --destructive-foreground: 210 40% 98%;
        --border: 214.3 31.8% 91.4%;
        --input: 214.3 31.8% 91.4%;
        --ring: 346.8 77.2% 49.8%;
        --radius: 0.5rem;
      }

      .dark {
        --background: 222.2 84% 4.9%;
        --foreground: 210 40% 98%;
        --card: 222.2 84% 4.9%;
        --card-foreground: 210 40% 98%;
        --popover: 222.2 84% 4.9%;
        --popover-foreground: 210 40% 98%;
        --primary: 346.8 77.2% 49.8%;
        --primary-foreground: 355.7 100% 97.3%;
        --secondary: 217.2 32.6% 17.5%;
        --secondary-foreground: 210 40% 98%;
        --muted: 217.2 32.6% 17.5%;
        --muted-foreground: 215 20.2% 65.1%;
        --accent: 217.2 32.6% 17.5%;
        --accent-foreground: 210 40% 98%;
        --destructive: 0 62.8% 30.6%;
        --destructive-foreground: 210 40% 98%;
        --border: 217.2 32.6% 17.5%;
        --input: 217.2 32.6% 17.5%;
        --ring: 346.8 77.2% 49.8%;
        background-color: #020817 !important;
        color: white !important;
      }

      .dark h1, .dark h2, .dark h3, .dark h4, .dark h5, .dark h6 {
        color: hsl(var(--foreground)) !important;
      }
      
      .dark p, .dark label, .dark .text-slate-600, .dark .text-slate-500 {
        color: hsl(var(--muted-foreground)) !important;
      }

      .dark input::placeholder, .dark textarea::placeholder {
        color: hsl(var(--muted-foreground)) !important;
        opacity: 0.7;
      }

      .dark input, .dark select, .dark textarea {
        background-color: hsla(var(--muted), 0.1) !important;
        color: hsl(var(--foreground)) !important;
        border-color: hsla(var(--border), 0.3) !important;
      }

      @layer base {
        * {
          border-color: hsl(var(--border));
        }
        body {
          background-color: hsl(var(--background));
          color: hsl(var(--foreground));
          font-family: 'Outfit', sans-serif;
        }
      }

      .glass {
        background-color: rgba(255, 255, 255, 0.7);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        border: 1px solid rgba(255, 255, 255, 0.2);
        box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
      }
      
      .dark .glass {
        background-color: rgba(0, 0, 0, 0.7);
        border: 1px solid rgba(255, 255, 255, 0.1);
      }

      .gradient-rose {
        background: linear-gradient(to bottom right, #f43f5e, #ec4899, #e11d48);
      }

      .text-gradient {
        background: linear-gradient(to bottom right, #e11d48, #ec4899);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
      }

      .glass-premium {
        background-color: hsla(var(--background), 0.4);
        backdrop-filter: blur(20px);
        -webkit-backdrop-filter: blur(20px);
        border: 1px solid hsla(var(--border), 0.3);
        box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
        box-shadow: 0 8px 32px 0 rgba(225, 29, 72, 0.1);
      }

      /* Diagnostic removed, added real fix */
      html.dark body {
        background-color: #020817 !important;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    <script>
      // Brute force toggle
      window.toggleTheme = function() {
        const html = document.documentElement;
        html.classList.toggle('dark');
        localStorage.setItem('vite-ui-theme', html.classList.contains('dark') ? 'dark' : 'light');
        console.log('BRUTE_FORCE_TOGGLE', html.classList.contains('dark'));
      };
      
      // Sync with localStorage on load
      (function() {
        const theme = localStorage.getItem('vite-ui-theme') || 'dark';
        if (theme === 'dark') document.documentElement.classList.add('dark');
      })();
    </script>
  </body>
</html>
